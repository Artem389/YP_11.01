{% extends 'hotel_booking/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Оставить отзыв{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Отзыв об отеле "{{ hotel.name }}"</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Отправить отзыв</button>
                            <a href="{% url 'hotel_detail' hotel.id %}" class="btn btn-secondary">Назад</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
