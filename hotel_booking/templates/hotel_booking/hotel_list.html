{% extends 'hotel_booking/base.html' %}

{% block title %}Список отелей{% endblock %}

{% block content %}
    <h2>Наши отели</h2>
    <ul>
        {% for hotel in hotels %}
            <li>
                <strong>{{ hotel.name }}</strong> ({{ hotel.stars }}⭐)<br>
                {{ hotel.address }}<br>
                <a href="{% url 'room_list' hotel.id %}">Смотреть номера</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
